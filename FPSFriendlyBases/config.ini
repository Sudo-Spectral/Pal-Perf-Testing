; Seconds between map-object ticks. Higher = more FPS around dense bases.
TickInterval=15.0
; Keep build objects visible in this band. false saves FPS when far away.
bBuildObjectVisible=true
; Skip skeletal-mesh ticks. true = more FPS; animated buildings update less.
bInvalidTickForSkeletalMeshComponent=true

