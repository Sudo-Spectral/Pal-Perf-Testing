; FPS Friendly Bases config
; Maximum-harsh performance preset. Edit values, then restart Palworld.
; Higher TickInterval = more FPS, but pals/buildings update less often.

[General]
; How many base camps may fully tick in one frame.
; Lower = smoother FPS spikes. Higher = camps catch up faster after travel.
BaseCampTickInvokeMaxNumInOneTick=1

[BaseCamp.Band1]
; Player distance threshold for this band (-1 = nearest / closest tier).
DistanceInRangeFromPlayer=-1.0
; Seconds between base AI updates. Higher = more FPS, pals look less lively.
TickInterval=30.0
; Merge ground loot piles. true = less item-clutter CPU cost.
bMergeDropItems=true
; Use simplified base updates. true = more FPS; pals may look idle while working.
bUpdateSimple=true

